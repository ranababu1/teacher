name: CI

# Analyze + full test suite + a debug-build smoke test of the Gradle/plugin
# chain, on every push and pull request. Free on public repos.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get

      # Info-level lints don't gate CI; errors and warnings still do.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      # Cheap end-to-end exercise of the whole Android chain: google-services
      # plugin, crashlytics plugin, manifest merge, backup rules.
      - run: flutter build apk --debug