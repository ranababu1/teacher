name: iOS

# Unsigned iOS release build on macOS, on every push and pull request.
# Proves the Xcode project, plugins and Swift code compile. Signing and the
# App Store upload happen on Imran's Mac (docs/release-ios.md), so this job
# needs no Apple secrets.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: xcodebuild -version

      - run: flutter pub get

      - name: Build iOS (release, unsigned)
        run: flutter build ios --release --no-codesign
