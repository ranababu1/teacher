name: iOS

# Unsigned iOS release build on macOS, on every push and pull request.
# Proves the Xcode project, plugins and Swift code compile. Signing and the
# App Store upload happen on Imran's Mac (docs/release-ios.md), so this job
# needs no Apple secrets.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: xcodebuild -version

      - run: flutter pub get

      - name: Build iOS (release, unsigned)
        run: flutter build ios --release --no-codesign

      - name: Verify the built app
        run: |
          app=build/ios/iphoneos/Runner.app
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Info.plist"; }
          test "$(pb CFBundleIdentifier)" = dev.imrn.teacher
          test "$(pb CFBundleDisplayName)" = Teacher
          test "$(pb ITSAppUsesNonExemptEncryption)" = false
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          test "$(pb CFBundleShortVersionString)" = "${version%%+*}"
          test "$(pb CFBundleVersion)" = "${version##*+}"
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$app/Assets.car"
          echo "Runner.app OK: $(pb CFBundleIdentifier) $(pb CFBundleShortVersionString) ($(pb CFBundleVersion))"
