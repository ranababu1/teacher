name: Release

# Builds and publishes a signed release when a version tag is pushed:
#   git tag v0.16.0 && git push origin v0.16.0
#
# Produces:
#   - universal obfuscated release APK -> attached to the GitHub Release
#   - signed .aab                      -> workflow artifact (for Play Store)
#   - Dart symbol files                -> workflow artifact (kept so a
#                                        Crashlytics upload can be redone)
#
# Requires four repository secrets (Settings -> Secrets and variables ->
# Actions); the build fails fast if any are missing:
#   ANDROID_KEYSTORE_BASE64    base64 of android/app/upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD  keystore store password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get

      # Info-level lints don't gate CI; errors and warnings still do.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      - name: Materialize release signing from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build obfuscated release APK and app bundle
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/symbols
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Archive Dart symbol files
        uses: actions/upload-artifact@v4
        with:
          name: release-symbols-${{ github.ref_name }}
          path: build/symbols/
          retention-days: 90

      - name: Archive signed app bundle (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: appbundle-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Create GitHub Release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk