name: teacher
description: "Teacher: an AI-assisted deep learning platform for technical subjects."
publish_to: 'none'

version: 0.14.1+18

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.5.0

  # Local persistence
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # Secure on-device secret storage (AI provider API keys).
  # Pinned exactly: 11.0.0 hardcodes compileSdk 37 in its own Android
  # build script, and Google isn't publishing a plain "android-37" SDK
  # platform this cycle (only fractional ones like "android-37.0"), so
  # 11.0.0 fails to build. Revisit once a fixed release ships.
  flutter_secure_storage: 10.3.1

  # Networking (future AI providers)
  dio: ^5.11.0

  # Live device network connectivity (Settings "internet connected" indicator)
  connectivity_plus: ^6.1.5

  # Serialization
  json_annotation: ^4.12.0
  equatable: ^2.1.0

  # Logging
  logger: ^2.7.0

  # Formatting / dates
  intl: ^0.20.3

  # Code display
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0
  flutter_markdown_plus: ^1.0.12

  # Scheduled local notifications (weekly flash cards)
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  json_serializable: ^6.14.1
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/curriculum/python/
    - assets/curriculum/react/
    - assets/curriculum/java/
    - assets/curriculum/spring-boot/
    - assets/curriculum/nodejs/
    - assets/curriculum/go/
    - assets/curriculum/databases/
    - assets/curriculum/vector-databases/
    - assets/curriculum/ai-ml/
    - assets/curriculum/llm-engineering/
    - assets/curriculum/docker/
    - assets/curriculum/kubernetes/
    - assets/curriculum/system-design/
    - assets/curriculum/cloud-aws/
    - assets/curriculum/devops/
    - assets/curriculum/statistics/
    - assets/curriculum/manifest.json

  fonts:
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegible-BoldItalic.ttf
          weight: 700
          style: italic

# App icon source — regenerate via `dart run flutter_launcher_icons`.
# Source images are produced by test/_generate_icon.dart (not a real
# test; run it once with `flutter test --update-goldens
# test/_generate_icon.dart` after changing the design, then re-run the
# command above).
flutter_launcher_icons:
  image_path: "assets/icon/app_icon_full.png"
  android: true
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
