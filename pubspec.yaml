name: teacher
description: "Teacher: an AI-assisted deep learning platform for technical subjects."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.5.0

  # Local persistence
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # Networking (future AI providers)
  dio: ^5.11.0

  # Serialization
  json_annotation: ^4.12.0
  equatable: ^2.1.0

  # Configuration
  flutter_dotenv: ^6.0.1

  # Logging
  logger: ^2.7.0

  # Formatting / dates
  intl: ^0.20.3

  # Code display
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/curriculum/python/
    - assets/curriculum/react/
    - assets/curriculum/manifest.json
    - .env
